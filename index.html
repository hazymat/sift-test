  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sift test</title>
  <meta name="description" content="Tasks, day plans, thoughts, things, contacts, scans and contracts, all in one place.">
  <meta name="theme-color" content="#0f172a">
  <script src="js/teststorage.js"></script>
  <script>
    // Apply the saved theme before first paint; the setting itself lives in IndexedDB.
    (function () {
      // (Themes: js/app.js THEMES. "blue" is the old name of Glass.)
      var t = 'glass';
      try { t = siftTestStorage.getItem('sift-theme') || t; } catch (e) {}
      var look = { glass: 'blue', 'glass-fancy': 'blue', blue: 'blue', dark: 'dark', light: 'light', auto: 'auto' }[t] || 'blue';
      if (look === 'auto') look = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'blue';
      var fonts = t === 'glass-fancy' ? 'fancy' : 'plain';
      // Custom theme: its starting look and the CSS made from the user's picks (js/customtheme.js).
      if (t === 'custom') try {
        var c = JSON.parse(siftTestStorage.getItem('sift-custom'));
        look = c.look; fonts = c.fonts; document.documentElement.dataset.custom = '';
        var st = document.createElement('style'); st.id = 'custom-theme-css'; st.textContent = c.css; document.head.appendChild(st);
      } catch (e) {}
      document.documentElement.dataset.theme = look;
      document.documentElement.dataset.fonts = fonts;
      // Text size is per device (Settings → Appearance).
      try { var z = siftTestStorage.getItem('sift-text-size'); if (z) document.documentElement.style.fontSize = z + '%'; } catch (e) {}
    })();
  </script>

  <header class="appbar">
    <h1 id="page-title" class="page-title">Sift</h1>
    <nav class="topnav" aria-label="Areas">
      <div id="topnav-links"></div>
      <details id="topnav-overflow" hidden>
        <summary id="topnav-more"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg><span>More</span></summary>
        <div id="topnav-more-menu" class="menu"></div>
      </details>
    </nav>
    <div class="top-search">
      <svg class="icon top-search-icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="search" id="top-search" name="q" class="search" placeholder="Search everything…" title="Search everything (Ctrl+K)" autocomplete="off" data-1p-ignore data-lpignore="true" aria-label="Search everything">
      <div id="top-results" class="menu search-results" hidden></div>
    </div>
    <span id="sync-status" class="pill">Local only</span>
  </header>

  <div id="update-banner" class="banner" hidden>
    A new version of Sift is ready. <button type="button">Reload</button>
  </div>

  <main id="main"></main>

  <nav id="tabbar" class="tabbar" aria-label="Areas"></nav>

  <dialog id="more-sheet" class="sheet" aria-label="More areas">
    <div class="sheet-handle" tabindex="-1" autofocus></div>
    <input type="search" id="more-search" name="q" class="search" placeholder="Search everything…" autocomplete="off" data-1p-ignore data-lpignore="true" aria-label="Search everything">
